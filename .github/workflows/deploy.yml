name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --verify --token=${{ secrets.VERCEL_TOKENS }} --org=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID }} --environment=Preview

      - name: Build Project
        run: |
          cd frontend
          vercel build --token=${{ secrets.VERCEL_TOKENS }} --prod

      - name: Deploy to Production
        run: |
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKENS }} --prod
